"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
scan_timeout = 100
command_timeout = 1000

# Overlay contract: [vcs], [hg_*] and [custom.*] are intentionally left at
# Starship defaults / undefined so a machine-local fragment can be appended to
# this file without a TOML duplicate-table error. Undefined ${custom.*} slots
# render nothing; $custom renders any custom module not placed explicitly.
format = """
$os\
$shell\
$directory\
$vcs\
${custom.vcs_extra}\
$character"""

right_format = """
$status\
$cmd_duration\
$jobs\
$username\
$hostname\
${env_var.YAZI_LEVEL}\
${env_var.VIMRUNTIME}\
$custom"""

[os]
disabled = false
format = "[$symbol]($style) "
style = "15"

[os.symbols]
AlmaLinux = ""
Alpine = ""
Amazon = ""
Android = ""
Arch = ""
Artix = ""
CachyOS = ""
CentOS = ""
Debian = ""
DragonFly = ""
EndeavourOS = ""
Fedora = ""
FreeBSD = ""
Garuda = ""
Gentoo = ""
Kali = ""
Linux = ""
Macos = ""
Manjaro = ""
Mint = ""
NetBSD = ""
NixOS = ""
Nobara = ""
OpenBSD = ""
openSUSE = ""
OracleLinux = ""
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
RockyLinux = ""
Solus = ""
SUSE = ""
Ubuntu = ""
Void = ""
Windows = ""
Zorin = ""

[shell]
disabled = false
format = "[$indicator]($style)"
style = "244"
zsh_indicator = ""
unknown_indicator = ""
bash_indicator = '\[bash\] '
fish_indicator = '\[fish\] '
powershell_indicator = '\[pwsh\] '
cmd_indicator = '\[cmd\] '
nu_indicator = '\[nu\] '
tcsh_indicator = '\[tcsh\] '
xonsh_indicator = '\[xonsh\] '
elvish_indicator = '\[elvish\] '
ion_indicator = '\[ion\] '

[directory]
style = "green"
before_repo_root_style = "109"
repo_root_style = "bold blue"
read_only = " "
read_only_style = "9"
format = "[ ]($style)[$path]($style)[$read_only]($read_only_style) "
repo_root_format = "[ ]($style)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1

[git_branch]
symbol = " "
style = "yellow"
only_attached = true
truncation_length = 32
format = "on [ ](white)[$symbol$branch]($style)(:[$remote_branch]($style)) "

[git_commit]
only_detached = true
commit_hash_length = 8
tag_disabled = false
tag_symbol = ""
style = "yellow"
format = "on [ ](white)[@](white)[$hash]($style)( [#](white)[$tag]($style)) "

[git_state]
style = "9"
format = "[$state( $progress_current/$progress_total)]($style) "
rebase = "rebase"
merge = "merge"
revert = "revert"
cherry_pick = "cherry-pick"
bisect = "bisect"
am = "am"
am_or_rebase = "am/rebase"

[git_status]
style = "yellow"
format = "([$ahead_behind]($style) )([$stashed]($style) )([$conflicted](9) )([$staged](178) )([$renamed](178) )([$deleted](9) )([$modified](178) )([$untracked](cyan) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇣${behind_count}⇡${ahead_count}"
stashed = "*${count}"
conflicted = "~${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
modified = "!${count}"
untracked = "?${count}"

[character]
success_symbol = "[»](39)"
error_symbol = "[»](9)"
vimcmd_symbol = "[](46)"
vimcmd_visual_symbol = "[](11)"
vimcmd_replace_symbol = "[▶](11)"
vimcmd_replace_one_symbol = "[▶](11)"

[status]
disabled = false
symbol = "✘ "
style = "9"
success_style = "green"
failure_style = "9"
recognize_signal_code = true
pipestatus = true
pipestatus_separator = "|"
pipestatus_segment_format = "[$status( $signal_name)]($style)"
pipestatus_format = '\[$pipestatus\] => [$symbol$status( $signal_name)]($style) '
format = "[$symbol$status( $signal_name)]($style) "

[cmd_duration]
min_time = 5_000
show_milliseconds = false
style = "yellow"
format = "took [$duration]($style) "

[jobs]
symbol = " "
number_threshold = 1
symbol_threshold = 1
style = "blue"
format = "[$symbol$number]($style) "

[username]
style_user = "183"
style_root = "bold red"
format = "on [$user]($style)"
show_always = true

[hostname]
ssh_only = false
style = "183"
format = "[@$hostname]($style)"

[env_var.YAZI_LEVEL]
symbol = "󰇥"
style = "11"
format = " [$symbol]($style)"

[env_var.VIMRUNTIME]
symbol = ""
style = "46"
format = " [$symbol]($style)"

# Optional right-prompt modules (add $conda / $kubernetes to right_format to enable):
# [conda]
# symbol = "🅒 "
# style = "37"
# format = "[$symbol$environment]($style) "
#
# [kubernetes]
# disabled = false
# symbol = "☸ "
# style = "134"
# format = "at [$symbol$context(/$namespace)]($style) "
