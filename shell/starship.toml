"$schema" = "https://starship.rs/config-schema.json"

add_newline = true

format = """
$os\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$character"""

right_format = """
$status\
$cmd_duration\
$jobs\
${env_var.YAZI_LEVEL}\
${env_var.VIMRUNTIME}\
$username\
$hostname"""

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold bright-white"

[os.symbols]
Alpine = ""
Amazon = ""
Arch = ""
CentOS = ""
Debian = ""
Fedora = ""
FreeBSD = ""
Gentoo = ""
Linux = ""
Macos = ""
Manjaro = ""
Mint = ""
NixOS = ""
OpenSUSE = ""
Pop = ""
Raspbian = ""
Redhat = ""
RedHatEnterprise = ""
RockyLinux = ""
SUSE = ""
Ubuntu = ""
Windows = ""

[directory]
style = "green"
before_repo_root_style = "109"
repo_root_style = "bold blue"
format = "[ ]($style)[$path]($style)[$read_only]($read_only_style) "
repo_root_format = "[ ]($style)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
truncation_length = 1
truncate_to_repo = true
fish_style_pwd_dir_length = 1
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "yellow"
truncation_length = 32
format = "on [ ](white)[$symbol$branch(:$remote_branch)]($style) "

[git_commit]
commit_hash_length = 8
tag_disabled = false
tag_symbol = " #"
style = "yellow"

[git_state]
style = "bold red"

[git_status]
style = "yellow"
format = "([$ahead_behind$stashed$conflicted$staged$modified$renamed$deleted$untracked]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇣${behind_count}⇡${ahead_count}"
stashed = "*${count}"
conflicted = "[~${count}](red)"
staged = "[+${count}](yellow)"
modified = "[!${count}](yellow)"
renamed = "[»${count}](yellow)"
deleted = "[✘${count}](red)"
untracked = "[?${count}](cyan)"

[character]
success_symbol = "[»](bold cyan)"
error_symbol = "[»](bold red)"
vimcmd_symbol = "[](bold green)"
vimcmd_visual_symbol = "[](bold yellow)"
vimcmd_replace_symbol = "[▶](bold yellow)"
vimcmd_replace_one_symbol = "[▶](bold yellow)"

[status]
disabled = false
symbol = "✘ "
style = "bold red"
format = "[$symbol$common_meaning$signal_name$maybe_int]($style) "

[cmd_duration]
min_time = 5_000
show_milliseconds = false
style = "yellow"
format = "took [$duration]($style) "

[jobs]
symbol = "✦"
style = "blue"
format = "[$symbol$number]($style) "

[env_var.YAZI_LEVEL]
symbol = "󰇥"
style = "bold yellow"
format = "[$symbol ]($style)"

[env_var.VIMRUNTIME]
symbol = ""
style = "bold green"
format = "[$symbol ]($style)"

[username]
style_user = "183"
style_root = "bold red"
format = "on [$user]($style)"
show_always = true

[hostname]
ssh_only = false
style = "183"
format = "[@$hostname]($style)"
