# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: Check Installer Scripts

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test-profiles:  # {{{
    name: Test Profile (${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: macos, os: macos-latest}
          - {profile: ubuntu, os: ubuntu-latest}
          - {profile: ubuntu-minimal, os: ubuntu-latest}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dotfiles
        run: ./install_profile -vv -x ${{ matrix.profile }}
  # }}}

  build-containers:  # {{{
    name: Build Containers (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, archlinux]
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.distro }} Linux container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.distro }}
          target: linux
          platforms: linux/amd64
          build-args: |
            user=dotuser
            uid=1000
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.distro }}
            ${{ matrix.distro == 'ubuntu' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          cache-from: type=gha,scope=${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=${{ matrix.distro }}
          load: true
          push: false
      - name: Smoke test ${{ matrix.distro }} Linux container
        run: ./scripts/test-containers.sh --smoke-only "ghcr.io/${{ github.repository }}:${{ matrix.distro }}"
      - name: Build ${{ matrix.distro }} macOS-UID container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.distro }}
          target: mac
          platforms: linux/amd64
          build-args: |
            user=dotuser
            mac_uid=501
          tags: ghcr.io/${{ github.repository }}:${{ matrix.distro }}-mac
          load: true
          push: false
      - name: Smoke test ${{ matrix.distro }} macOS-UID container
        run: ./scripts/test-containers.sh --smoke-only "ghcr.io/${{ github.repository }}:${{ matrix.distro }}-mac"
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push ${{ matrix.distro }} containers to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          docker push "ghcr.io/${{ github.repository }}:${{ matrix.distro }}"
          docker push "ghcr.io/${{ github.repository }}:${{ matrix.distro }}-mac"
          if [[ "${{ matrix.distro }}" == "ubuntu" ]]; then
            docker push "ghcr.io/${{ github.repository }}:latest"
          fi
  # }}}

...
