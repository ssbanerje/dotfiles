######################### General Settings #########################
# Eliminate escape delay for responsive modal editing in Neovim
set -s escape-time 0

# Scrollback, messages, and status refresh
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on

# Enable mouse support
set -g mouse on

# Modern 24-bit truecolor, clipboard (OSC 52), and terminal passthrough
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB,tmux-256color:RGB"
set -s set-clipboard on
set -g allow-passthrough on

# Refresh desktop/SSH/Wayland/truecolor environment variables on reattach
set -g update-environment "COLORTERM DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WAYLAND_DISPLAY WINDOWID XAUTHORITY"

# Activity alerts
setw -g monitor-activity on
set -g visual-activity on
set -g bell-action any

# Nested tmux instances
bind-key f send-prefix

######################### Keybindings #########################
# Reload configuration
bind r confirm-before -p "Reload conf (y/n)" "source-file ~/.tmux.conf"
bind R source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# Clear screen and scrollback history
bind -n C-l send-keys C-l \; run-shell 'sleep 0.1' \; clear-history

# Session management
bind C-c new-session
bind C command-prompt -p "New session:" "new-session -A -s '%%'"
bind X confirm-before -p "kill-session #S? (y/n)" kill-session
unbind S
bind S command-prompt -p "Switch session:" "switch-client -t '%%'"
bind C-f display-popup -E -w 80% -h 60% "$HOME/.local/bin/ftsession"

# Native pane zoom (replaces legacy tmp-window swap workaround)
unbind Up
bind Up resize-pane -Z
unbind Down
bind Down resize-pane -Z

# Splits & windows preserving current working directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -fh -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -fv -c "#{pane_current_path}"

# Window navigation and reordering
unbind Left
bind -r Left previous-window
unbind Right
bind -r Right next-window
bind C-p previous-window
bind C-n next-window
bind a last-window
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Kill window & quick process viewer
bind '#' confirm-before -p "kill-window #W? (y/n)" kill-window
bind '~' split-window "exec top"

# Fuzzy switchers & floating TUI popups
unbind P
bind P display-popup -E -w 80% -h 60% "$HOME/.local/bin/ftpane"
unbind O
bind O display-popup -E -w 80% -h 60% "$HOME/.local/bin/ftwind"
bind g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "lazygit"

######################### Navigation #########################
setw -g mode-keys vi
set -g status-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind-key Space select-pane -t :.+

######################### Copy & Paste #########################
unbind [
unbind p
bind Escape copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

######################### Windows #########################
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
setw -g aggressive-resize on
set -g set-titles on
setw -g clock-mode-colour blue
setw -g clock-mode-style 24

######################### Plugins #########################
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'

# Theme
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'coral'

# Theme - Highlight mode
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @tmux_power_prefix_highlight_pos 'LR'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_prefix_prompt 'Wait'
set -g @prefix_highlight_copy_prompt 'Copy'
set -g @prefix_highlight_sync_prompt 'Sync'

# Machine-local overrides (untracked)
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"

run '$HOME/.tmux/plugins/tpm/tpm'
