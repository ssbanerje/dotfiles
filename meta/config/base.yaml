# --- Base Configuration ---
- plugins:
    - installer/plugins
    - installer/plugins/dotbot-ifplatform
    - installer/plugins/dotbot-template

- defaults:
    link:
      create: true
      force: true
      relink: true
    shell:
      stderr: true

- clean:
    ~/:
      force: true
    ~/.local/bin:
      force: true
    ~/.config:
      recursive: true

- create:
  - ~/.config
  - ~/.local/bin
