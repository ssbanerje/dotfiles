# --- Ranger Configuration ---
- ifubuntu:
    - apt:
        - file
        - highlight
        - ranger
        - python3-pil

- ifarch:
    - pacman:
        - file
        - highlight
        - ranger
        - python-pillow

- ifmacos:
    - brew:
        - highlight
        - ranger

- create:
    - ~/.config/ranger

- link:
    ~/.config/ranger/rifle.conf: ranger/rifle.conf
    ~/.config/ranger/rc.conf: ranger/rc.conf
    ~/.config/ranger/commands.py: ranger/commands.py

- shell:
    - ["if [ ! -d ~/.config/ranger/plugins/ranger_devicons ]; then git clone --depth 1 https://github.com/alexanderjeurissen/ranger_devicons ~/.config/ranger/plugins/ranger_devicons; fi", "Install Ranger Icons"]
