# --- Git Configuration ---
- template:
    ~/.gitconfig:
      source_file: git/gitconfig
      params:
        NAME: Subho Banerjee
        EMAIL: ssbanerje@gmail.com
        GITHUB_USERNAME: ssbanerje
        SMTP_SERVER: smtp.gmail.com
        SMTP_PORT: 587
        SMTP_ENCRYPTION: tls
        __UNAME__:
          CREDENTIAL_HELPER:
            Darwin: osxkeychain
            Linux: cache --timeout 36000

- link:
    ~/.gitattributes: git/gitattributes

- shell:
    - [
        'tmp="$(mktemp)"; for f in Archives Backup Diff Dropbox Linux Vim Xcode macOS; do cat "git/gitignore/Global/${f}.gitignore" >> "$tmp"; done; if ! cmp -s "$tmp" ~/.global_gitignore; then mv "$tmp" ~/.global_gitignore; else rm -f "$tmp"; fi',
        "Assemble global gitignore",
      ]
