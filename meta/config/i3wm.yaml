# --- i3wm Configuration ---
- ifubuntu:
    - apt:
        - i3
        - i3status
        - rofi
        - xss-lock
        - i3lock-fancy
        - network-manager-gnome
        - blueman
        - pipewire-pulse
        - wireplumber
        - pulseaudio-utils

- ifarch:
    - pacman:
        - i3
        - i3status
        - rofi
        - xss-lock
        - networkmanager
        - blueman
        - pipewire-pulse
        - wireplumber
        - libpulse
    - yay:
        - i3lock-fancy

- link:
    ~/.config/i3/config: i3wm/i3.conf
    ~/.config/i3status/config: i3wm/i3status.conf
    ~/.config/rofi/config.rasi: i3wm/rofi.conf
