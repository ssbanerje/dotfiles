# --- TMUX Configuration ---
- ifubuntu:
    - apt:
        - tmux

- ifarch:
    - pacman:
        - tmux

- ifmacos:
    - brew:
        - tmux

- link:
    ~/.tmux.conf: tmux/tmux.conf
    ~/.tmux/plugins/tpm: tmux/tpm

- shell:
    - command: ~/.tmux/plugins/tpm/bin/install_plugins
      description: Installing tmux plugins via TPM
      stdout: true
