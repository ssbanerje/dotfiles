# --- Terminal Emulator Configuration ---
- ifmacos:
    - cask:
        - kitty
        - iterm2
        - font-hack-nerd-font

- ifubuntu:
    - apt:
        - curl
        - libnotify-bin
        - kitty
- ifarch:
    - pacman:
        - curl
        - libnotify
        - kitty
- ifanylinux:
    - ghrelease:
        ryanoasis/nerd-fonts:
          asset: Hack.tar.xz
          extract_to: ~/.local/share/fonts/Hack
          creates: ~/.local/share/fonts/Hack/HackNerdFont-Regular.ttf
          post_install:
            - if command -v fc-cache >/dev/null 2>&1; then fc-cache -f ~/.local/share/fonts; fi

- link:
    ~/.config/kitty/kitty.conf: kitty/kitty.conf
    ~/.config/kitty/tokyonight.conf: kitty/tokyonight.conf

- template:
    ~/.config/kitty/keymaps.conf:
      source_file: kitty/keymaps.conf
      params:
        PREFIX: ctrl+a
        __UNAME__:
          MOD_KEY:
            Darwin: cmd
            Linux: ctrl+shift

- ifmacos:
    - link:
        ~/.config/kitty/macos-launch-services-cmdline: kitty/macos-launch-services-cmdline
    - create:
        - ~/Library/Preferences
    - shell:
        - ["cmp -s iterm2/com.googlecode.iterm2.plist ~/Library/Preferences/com.googlecode.iterm2.plist || command cp -f iterm2/com.googlecode.iterm2.plist ~/Library/Preferences/com.googlecode.iterm2.plist", "Install iTerm2 preferences"]
        - ["[ -s ~/.config/iterm2_shell_integration.bash ] || curl -fsSL https://iterm2.com/shell_integration/bash -o ~/.config/iterm2_shell_integration.bash", "Download iTerm2 Bash shell integration"]
