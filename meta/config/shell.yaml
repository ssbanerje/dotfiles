# --- Shell Configuration ---
- ifubuntu:
    - apt:
        - zsh
        - fzf
        - zoxide
        - tealdeer
    - shell:
        - [
            'if [ ! -x ~/.local/bin/starship ] && ! command -v starship >/dev/null 2>&1; then mkdir -p ~/.local/bin && curl -fsSL "https://github.com/starship/starship/releases/latest/download/starship-$(uname -m)-unknown-linux-musl.tar.gz" | tar -xz -C ~/.local/bin starship; fi',
            "Install Starship prompt",
          ]
        - [
            'if [ ! -x ~/.local/bin/uv ] && ! command -v uv >/dev/null 2>&1; then mkdir -p ~/.local/bin && curl -fsSL "https://github.com/astral-sh/uv/releases/latest/download/uv-$(uname -m)-unknown-linux-musl.tar.gz" | tar -xz --strip-components=1 -C ~/.local/bin; fi',
            "Install uv Python manager",
          ]

- ifarch:
    - pacman:
        - zsh
        - fzf
        - zoxide
        - tealdeer
        - starship
        - uv

- ifmacos:
    - brew:
        - zsh
        - bash-completion
        - fzf
        - zoxide
        - tealdeer
        - starship
        - coreutils
        - uv

- shell:
    - [
        'export PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"; command -v ipython >/dev/null 2>&1 || UV_TOOL_BIN_DIR="$HOME/.local/bin" uv tool install --no-cache ipython',
        "Install IPython via uv",
      ]
    - [
        'if command -v tldr >/dev/null 2>&1; then tldr --list 2>/dev/null | grep -q . || tldr --update; fi',
        "Populate tealdeer tldr cache",
      ]

- link:
    ~/.config/antidote: shell/antidote
    ~/.config/zsh_plugins.txt: shell/plugins.txt
    ~/.config/zsh_plugins_macos.txt: shell/plugins_macos.txt
    ~/.config/zsh_plugins_ubuntu.txt: shell/plugins_ubuntu.txt
    ~/.config/zsh_plugins_arch.txt: shell/plugins_arch.txt
    ~/.config/starship.toml: shell/starship.toml
    ~/.zshrc: shell/zshrc
    ~/.bashrc: shell/bashrc
    ~/.config/env.sh: shell/env.sh
    ~/.config/aliases.sh: shell/aliases.sh
    ~/.hushlogin: shell/hushlogin
    ~/.curlrc: shell/curlrc
    ~/.gdbinit: shell/gdbinit
    ~/.wgetrc: shell/wgetrc

- shell:
    - ["zsh -i -c exit", "Install ZSH plugins"]
