# --- Shell Configuration ---
- ifubuntu:
    - apt:
        - zsh
        - fzf
        - silversearcher-ag
        - libnotify-bin
        - ipython3
        - python3-pygments

- ifarch:
    - pacman:
        - zsh
        - fzf
        - the_silver_searcher
        - libnotify
        - ipython
        - python-pygments

- ifmacos:
    - tap:
        - homebrew/command-not-found
    - brew:
        - zsh
        - bash-completion
        - fzf
        - coreutils
        - the_silver_searcher
        - ipython
        - pygments

- link:
    ~/.config/antidote: shell/antidote
    ~/.config/zsh_plugins.txt: shell/plugins.txt
    ~/.config/zsh_plugins_macos.txt: shell/plugins_macos.txt
    ~/.config/zsh_plugins_ubuntu.txt: shell/plugins_ubuntu.txt
    ~/.config/zsh_plugins_arch.txt: shell/plugins_arch.txt
    ~/.zshrc: shell/zshrc
    ~/.p10k.zsh: shell/p10k.zsh
    ~/.bashrc: shell/bashrc
    ~/.config/bash_prompt.sh: shell/bash_prompt.sh
    ~/.config/env.sh: shell/env.sh
    ~/.config/aliases.sh: shell/aliases.sh
    ~/.hushlogin: shell/hushlogin
    ~/.curlrc: shell/curlrc
    ~/.gdbinit: shell/gdbinit
    ~/.wgetrc: shell/wgetrc

- shell:
    - ["zsh -i -c exit", "Install ZSH plugins"]
