# --- AstroNvim Configuration ---
- ifubuntu:
    - create:
        - ~/.local/bin
        - ~/.npm-global
    - apt:
        - curl
        - nodejs
        - npm
        - unzip
        - ripgrep
        - fd-find
        - python3-pynvim
        - python3-debugpy
    - shell:
        - ["NVIM_CAND=$(apt-cache policy neovim 2>/dev/null | awk '/Candidate:/ {print $2}'); if [ -n \"$NVIM_CAND\" ] && [ \"$NVIM_CAND\" != \"(none)\" ] && dpkg --compare-versions \"$NVIM_CAND\" ge \"0.11\"; then sudo DEBIAN_FRONTEND=noninteractive apt-get install -y neovim; else case \"$(uname -m)\" in aarch64|arm64) NVIM_ARCH=arm64 ;; *) NVIM_ARCH=x86_64 ;; esac; rm -rf ~/.local/nvim-linux64; curl -fLSs \"https://github.com/neovim/neovim/releases/latest/download/nvim-linux-${NVIM_ARCH}.tar.gz\" | tar xzf - -C ~/.local && mv ~/.local/nvim-linux-\"${NVIM_ARCH}\" ~/.local/nvim-linux64 && ln -sf ~/.local/nvim-linux64/bin/nvim ~/.local/bin/nvim; fi", "Install Neovim >= 0.11"]
        - ["LG_CAND=$(apt-cache policy lazygit 2>/dev/null | awk '/Candidate:/ {print $2}'); if [ -n \"$LG_CAND\" ] && [ \"$LG_CAND\" != \"(none)\" ]; then sudo DEBIAN_FRONTEND=noninteractive apt-get install -y lazygit; else case \"$(uname -m)\" in aarch64|arm64) LG_ARCH=arm64 ;; *) LG_ARCH=x86_64 ;; esac; LG_VER=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/jesseduffield/lazygit/releases/latest | sed 's#.*/tag/v##'); curl -fLSs \"https://github.com/jesseduffield/lazygit/releases/download/v${LG_VER}/lazygit_${LG_VER}_linux_${LG_ARCH}.tar.gz\" | tar xzf - -C ~/.local/bin lazygit; fi", "Install lazygit"]
        - ["npm config set prefix ~/.npm-global", "Configure user-local npm prefix"]
    - npm:
        stdout: false
        stderr: true
        packages:
          - tree-sitter-cli

- ifarch:
    - pacman:
        - neovim
        - nodejs
        - npm
        - unzip
        - ripgrep
        - fd
        - lazygit
        - python-pynvim
        - python-debugpy
        - tree-sitter-cli

- ifmacos:
    - brew:
        - neovim
        - node
        - unzip
        - ripgrep
        - fd
        - lazygit
        - tree-sitter-cli

- link:
    ~/.config/nvim: editors/nvim
    ~/.editorconfig: editors/editorconfig

- shell:
    - ["PATH=\"$HOME/.local/bin:$HOME/.npm-global/bin:$PATH\" nvim --headless '+Lazy! sync' +qa", "Installing AstroNvim Plugins"]
