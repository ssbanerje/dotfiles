# --- AstroNvim Configuration ---
- ifdebian:
    - apt:
        - curl
        - gcc
        - nodejs
        - npm
        - unzip
        - ripgrep
        - fd-find
        - python3-debugpy
        - neovim:
            if_available: true
            min_version: "0.11"
        - lazygit:
            if_available: true
    - ghrelease:
        neovim/neovim:
          asset: nvim-linux-{arch}.tar.gz
          extract_to: ~/.local/opt/nvim
          strip_components: 1
          bins: [bin/nvim]
          min_version: "0.11"
        jesseduffield/lazygit:
          asset: lazygit_{version}_linux_{arch}.tar.gz
          bins: [lazygit]
        tree-sitter/tree-sitter:
          asset: tree-sitter-linux-{node_arch}.gz
          bins: [tree-sitter]

- ifarch:
    - pacman:
        - neovim
        - nodejs
        - npm
        - unzip
        - ripgrep
        - fd
        - lazygit
        - python-debugpy
        - tree-sitter-cli

- ifmacos:
    - brew:
        - neovim
        - node
        - unzip
        - ripgrep
        - fd
        - lazygit
        - tree-sitter-cli

- link:
    ~/.config/nvim: editors/nvim
    ~/.editorconfig: editors/editorconfig

- shell:
    - command: |
        export PATH="$HOME/.local/bin:$PATH"
        nvim --headless "+lua require('astrocore').config.treesitter.ensure_installed = {}" '+Lazy! sync' '+helptags ALL' +qa
        if command -v tree-sitter >/dev/null 2>&1; then
          nvim --headless "+lua local ac = require('astrocore'); local langs = vim.deepcopy(ac.config.treesitter.ensure_installed or {}); ac.config.treesitter.ensure_installed = {}; require('lazy').load({ plugins = { 'nvim-treesitter' } }); if type(langs) == 'table' and #langs > 0 then require('nvim-treesitter').install(langs):wait(300000) end" '+helptags ALL' +qa
        fi
      description: Installing AstroNvim Plugins and Treesitter Parsers
