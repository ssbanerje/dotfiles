# --- MacOS UI Elements Configuration ---
- ifmacos:
    - tap:
        - asmvik/formulae

    - brew:
        - yabai

    - cask:
        - hammerspoon

    - link:
        ~/.yabairc: yabai/yabairc
        ~/.hammerspoon: hammerspoon

    - shell:
        - ["yabai --start-service || true", "Start yabai background service"]
        - ["./scripts/macos.sh", "Apply macOS system preferences"]
