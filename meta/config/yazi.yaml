# --- Yazi Terminal File Manager Configuration ---
- ifubuntu:
    - apt:
        - chafa
        - file
        - jq
        - p7zip-full
        - poppler-utils
        - unzip
    - shell:
        - [
            'if ! command -v yazi >/dev/null 2>&1; then mkdir -p ~/.local/bin && curl -fsSL "https://github.com/sxyazi/yazi/releases/latest/download/yazi-$(uname -m)-unknown-linux-musl.zip" -o /tmp/yazi.zip && unzip -oqj /tmp/yazi.zip "*/yazi" "*/ya" -d ~/.local/bin && chmod +x ~/.local/bin/yazi ~/.local/bin/ya && rm -f /tmp/yazi.zip; fi',
            "Install Yazi",
          ]

- ifarch:
    - pacman:
        - chafa
        - file
        - jq
        - p7zip
        - poppler
        - yazi

- ifmacos:
    - brew:
        - chafa
        - jq
        - poppler
        - sevenzip
        - yazi

- create:
    - ~/.config/yazi

- link:
    ~/.config/yazi/yazi.toml: yazi/yazi.toml
    ~/.config/yazi/keymap.toml: yazi/keymap.toml
