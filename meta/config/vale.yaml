# --- Vale Configuration ---
- ifubuntu:
    - shell:
        - [
            'if ! command -v vale >/dev/null 2>&1; then tag="$(curl -fsSLI -o /dev/null -w "%{url_effective}" https://github.com/vale-cli/vale/releases/latest | sed "s#.*/tag/##")"; ver="${tag#v}"; case "$(uname -m)" in aarch64|arm64) arch="arm64" ;; *) arch="64-bit" ;; esac; mkdir -p ~/.local/bin && curl -fsSL "https://github.com/vale-cli/vale/releases/download/${tag}/vale_${ver}_Linux_${arch}.tar.gz" | tar -xz -C ~/.local/bin vale; fi',
            "Install Vale v3",
          ]

- ifarch:
    - pacman:
        - vale

- ifmacos:
    - brew:
        - vale

- create:
    - ~/.config/vale

- link:
    ~/.vale.ini: editors/vale.ini

- shell:
    - ['PATH="$HOME/.local/bin:$PATH" vale --config="$HOME/.vale.ini" sync', "Sync Vale style packages"]
