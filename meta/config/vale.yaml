# --- Vale Configuration ---
- ifubuntu:
    - ghrelease:
        vale-cli/vale:
          asset: vale_{version}_Linux_{arch}.tar.gz
          arch_map:
            x86_64: 64-bit
            arm64: arm64
          bins: [vale]

- ifarch:
    - pacman:
        - vale

- ifmacos:
    - brew:
        - vale

- create:
    - ~/.config/vale

- link:
    ~/.vale.ini: editors/vale.ini

- shell:
    - ['PATH="$HOME/.local/bin:$PATH" vale --config="$HOME/.vale.ini" sync', "Sync Vale style packages"]
