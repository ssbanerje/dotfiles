#: Clipboard
map   kitty_mod+c          copy_to_clipboard
map   kitty_mod+v          paste_from_clipboard

#: Window Management
map   kitty_mod+n          new_os_window
map   kitty_mod+up         next_window
map   kitty_mod+down       previous_window

map   ctrl+shift+h         neighboring_window left
map   ctrl+shift+l         neighboring_window right
map   ctrl+shift+k         neighboring_window up
map   ctrl+shift+j         neighboring_window down

map   ctrl+a>space         next_layout
map   ctrl+a>r             layout_action rotate
map   ctrl+a>-             launch --cwd=current --location=hsplit
map   ctrl+a>shift+\       launch --cwd=current --location=vsplit
map   ctrl+a>shift+h       move_window left
map   ctrl+a>shift+l       move_window right
map   ctrl+a>shift+k       move_window up
map   ctrl+a>shift+j       move_window down

map   ctrl+a>up            goto_layout stack
map   ctrl+a>down          last_used_layout

#: Tab management
map   kitty_mod+t          new_tab_with_cwd
map   kitty_mod+w          close_tab
map   kitty_mod+right      next_tab
map   kitty_mod+left       previous_tab

map   kitty_mod+1          goto_tab 1
map   kitty_mod+2          goto_tab 2
map   kitty_mod+3          goto_tab 3
map   kitty_mod+4          goto_tab 4
map   kitty_mod+5          goto_tab 5
map   kitty_mod+6          goto_tab 6
map   kitty_mod+7          goto_tab 7
map   kitty_mod+8          goto_tab 8
map   kitty_mod+9          goto_tab 9

#: Miscellaneous
map   kitty_mod+alt+0      change_font_size all 0
map   kitty_mod+alt+=      change_font_size all +2.0
map   kitty_mod+alt+-      change_font_size all -2.0

map   kitty_mod+alt+,      reload_config_file

# vim:fileencoding=utf-8:ft=kitty
