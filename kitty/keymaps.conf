#: Clipboard
map   kitty_mod+c           copy_to_clipboard
map   kitty_mod+v           paste_from_clipboard

#: OS Window & Splits (kitty_mod = Cmd on macOS, Super on Linux)
map   kitty_mod+n           new_os_window
map   kitty_mod+d           launch --cwd=current --location=vsplit
map   kitty_mod+shift+d     launch --cwd=current --location=hsplit
map   kitty_mod+shift+enter toggle_layout stack
map   kitty_mod+w           close_window
map   kitty_mod+shift+w     close_tab
map   kitty_mod+r           layout_action rotate
map   kitty_mod+shift+r     next_layout

#: Seamless smart-splits focus & resize (Neovim <-> Kitty)
map   ctrl+h                kitten smart_nav.py move left
map   ctrl+j                kitten smart_nav.py move down
map   ctrl+k                kitten smart_nav.py move up
map   ctrl+l                kitten smart_nav.py move right
map   alt+h                 kitten smart_nav.py resize left 3
map   alt+j                 kitten smart_nav.py resize down 3
map   alt+k                 kitten smart_nav.py resize up 3
map   alt+l                 kitten smart_nav.py resize right 3

#: Direct split focus & reorder (bypasses child apps, matching iTerm2)
map   kitty_mod+alt+h       neighboring_window left
map   kitty_mod+alt+j       neighboring_window down
map   kitty_mod+alt+k       neighboring_window up
map   kitty_mod+alt+l       neighboring_window right
map   kitty_mod+[           previous_window
map   kitty_mod+]           next_window
map   kitty_mod+ctrl+h      move_window left
map   kitty_mod+ctrl+j      move_window down
map   kitty_mod+ctrl+k      move_window up
map   kitty_mod+ctrl+l      move_window right

#: Browser-aligned Tab management (matches Safari, Chrome, and iTerm2)
map   kitty_mod+t           new_tab_with_cwd
map   kitty_mod+shift+[     previous_tab
map   kitty_mod+shift+]     next_tab
map   ctrl+shift+tab        previous_tab
map   ctrl+tab              next_tab

map   kitty_mod+1           goto_tab 1
map   kitty_mod+2           goto_tab 2
map   kitty_mod+3           goto_tab 3
map   kitty_mod+4           goto_tab 4
map   kitty_mod+5           goto_tab 5
map   kitty_mod+6           goto_tab 6
map   kitty_mod+7           goto_tab 7
map   kitty_mod+8           goto_tab 8
map   kitty_mod+9           goto_tab 9

#: Start / End of Line (matches macOS/iTerm2 Cmd+Left/Right)
map   kitty_mod+left        send_key home
map   kitty_mod+right       send_key end

#: Font size & config reload (matches iTerm2 Cmd+0/=/- and Cmd+Shift+,)
map   kitty_mod+0           change_font_size all 0
map   kitty_mod+=           change_font_size all +2.0
map   kitty_mod+plus        change_font_size all +2.0
map   kitty_mod+-           change_font_size all -2.0
map   kitty_mod+shift+,     reload_config_file

# vim:fileencoding=utf-8:ft=kitty
