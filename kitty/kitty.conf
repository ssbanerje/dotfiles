#: General
allow_remote_control               socket-only
listen_on                          unix:/tmp/kitty
scrollback_lines                   10000
mouse_hide_wait                    1.0
enabled_layouts                    splits,tall:bias=50;full_size=1;mirrored=false,fat:bias=50;full_size=1;mirrored=false,stack
enable_audio_bell                  no
visual_bell_duration               0.2
bell_on_tab                        yes

#: Fonts
font_family                        Hack Nerd Font
font_size                          12.0

#: Clipboard/copy
strip_trailing_spaces              always
copy_on_select                     yes

#: Theme
include                            tokyonight.conf

tab_bar_edge                       top
tab_bar_style                      fade
tab_title_template                 "{index}:{title}"
window_padding_width               2

#: OS Overrides & Key Remaps
kitty_mod                          cmd
clear_all_shortcuts                yes
include                            keymaps.conf
globinclude                        os-${KITTY_OS}.conf

# vim:fileencoding=utf-8:ft=kitty
